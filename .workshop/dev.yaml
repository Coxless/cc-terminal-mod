# Workshop 定義ファイル (cc-terminal-mod)
# リファレンス: https://ubuntu.com/workshop/docs/reference/definition-files/workshop-definition/
#
# - name はファイル名 (.workshop/<name>.yaml) と一致させる
# - base / sdks を変更したら `workshop refresh` で反映する
# - actions の変更は refresh 不要 (即時反映)
#
# ワークショップの中で動かすのは Bun (sidecar のビルドとテスト、型チェック) だけ。
# Claude Code 本体 (`claude --plugin-dir ./mod` / `claude plugin validate` / `claude plugin test`) はホストで動かす。

name: dev
base: ubuntu@24.04

sdks:
  - name: project-bun   # .workshop/bun/ のプロジェクト内 SDK (Store に Bun の SDK が無いため)

# `workshop run -- <action> [引数...]` で実行する名前付きスクリプト。
# bash (errexit + pipefail) で実行される。プロジェクトは /project にマウントされる。
actions:
  setup: |
    cd /project
    bun install

  test: |
    cd /project
    bun test "$@"

  # 型チェック。mod/tsconfig.json は Mod を一度ロードすると配置される。
  lint: |
    cd /project
    bunx tsc -p ./mod --noEmit "$@"

  # 対象は Mod のソースだけ (設計文書とスパイクは整形しない)。
  fmt: |
    cd /project
    bunx prettier --write mod "$@"
