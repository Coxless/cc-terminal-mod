# CI: develop / main への push と pull request で、テスト・型チェック・整形の確認・Mod の検証・sidecar のビルドを回す。
# CD: main への push(= リリース)で、sidecar をビルドして zip にまとめ、GitHub Releases に置く。
#     そのあと、マーケットプレイス(.claude-plugin/marketplace.json)の取得元を、その zip の URL と SHA-256 に書き換えて
#     main にコミットする。バイナリは、どのブランチにも入れない。
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  # Mods API は early access でリリースごとに変わる。型定義もこの版のものを使うので、固定している。
  # 上げるときは、手元でも同じ版で確認する(CLAUDE.md の「Mods API の参照先」)。
  CLAUDE_CODE_VERSION: 2.1.289

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 利用者に更新が届くのは plugin.json の version が変わったときだけ。上げ忘れたリリースを止める
      - name: Require a version bump (pull requests into main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git fetch -q --depth=1 origin main
          released=$(git show FETCH_HEAD:mod/.claude-plugin/plugin.json 2>/dev/null | jq -r .version || true)
          current=$(jq -r .version mod/.claude-plugin/plugin.json)
          echo "current=$current released=${released:-none}"
          if [ "$current" = "$released" ]; then
            echo "::error file=mod/.claude-plugin/plugin.json::version $current is already on main. Bump \"version\" before releasing."
            exit 1
          fi

      # Bun の版は、開発環境(Workshop)と同じものを使う
      - name: Read the Bun version
        id: bun
        run: echo "version=$(sed -n 's/.*BUN_VERSION:-\([0-9.]*\).*/\1/p' .workshop/bun/hooks/setup-base)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile

      - name: Test (bun)
        run: bun test .spec.ts

      - name: Check formatting
        run: bunx prettier --check mod

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # hooks の型定義(mod/.claude-plugin/types/)は、Mod をロードしたときに Claude Code が配置する。
      # ログインしていないので実行は失敗するが、配置はその前に済む。API は呼ばれない。
      - name: Place the Mods type definitions
        run: |
          claude --version
          claude --plugin-dir ./mod -p hi < /dev/null || true
          test -f mod/.claude-plugin/types/claude-code/index.d.ts

      - name: Type check
        run: |
          bunx tsc -p ./mod --noEmit
          bunx tsc -p ./mod/sidecar --noEmit

      - name: Validate the mod and the marketplace
        run: |
          claude plugin validate ./mod
          claude plugin validate .

      - name: Test (claude plugin test)
        run: claude plugin test ./mod

      - name: Build the sidecar
        run: bun build --compile --minify mod/sidecar/main.ts --outfile mod/bin/terminal-sidecar

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # 同じ version のリリースがすでにあれば、何もしない(出し直しても、利用者には届かない)
      - name: Decide whether to release
        id: version
        run: |
          version=$(jq -r .version mod/.claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released. Nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the Bun version
        if: steps.version.outputs.needed == 'true'
        id: bun
        run: echo "version=$(sed -n 's/.*BUN_VERSION:-\([0-9.]*\).*/\1/p' .workshop/bun/hooks/setup-base)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.needed == 'true'
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Build and package
        if: steps.version.outputs.needed == 'true'
        run: |
          bun install --frozen-lockfile
          bun build --compile --minify mod/sidecar/main.ts --outfile mod/bin/terminal-sidecar
          scripts/package.sh "$RUNNER_TEMP/terminal-${{ steps.version.outputs.version }}.zip"

      - name: Publish the GitHub release
        if: steps.version.outputs.needed == 'true'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "$RUNNER_TEMP/terminal-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes

      # 利用者が取得するのは、この書き換えが main に入った後。それまでは、1 つ前のリリースを指したまま。
      # GITHUB_TOKEN での push は、ワークフローを起動しない。
      - name: Point the marketplace at the new release
        if: steps.version.outputs.needed == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/terminal-$version.zip"
          sha=$(sha256sum "$RUNNER_TEMP/terminal-$version.zip" | cut -d' ' -f1)
          manifest=.claude-plugin/marketplace.json
          jq --arg url "$url" --arg sha "$sha" \
            '(.plugins[] | select(.name == "terminal") | .source) = { source: "archive", url: $url, sha256: $sha }' \
            "$manifest" > "$RUNNER_TEMP/marketplace.json"
          mv "$RUNNER_TEMP/marketplace.json" "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $version: point the marketplace at the new archive" "$manifest"
          git push origin HEAD:main
